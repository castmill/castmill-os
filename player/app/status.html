<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
<title>Castmill OS</title>
<link rel="stylesheet" href="status.css">
</head>
<body>
<main>
  <div class="brand">Castmill™ OS</div>
  <section id="message">
    <p id="headline" class="lead">Starting…</p>
    <p id="detail" class="detail"></p>
  </section>
  <dl class="facts">
    <dt>Device</dt><dd id="device">–</dd>
    <dt>Output</dt><dd id="output">–</dd>
    <dt>Version</dt><dd id="version">–</dd>
    <dt>Castmill</dt><dd id="online">–</dd>
  </dl>
  <section id="wifi" class="wifi" hidden>
    <h2>Wi-Fi</h2>
    <p class="detail">Connect this device to the venue's Wi-Fi. Use a USB keyboard and mouse, or a touchscreen.</p>
    <ul id="wifi-networks" class="networks"></ul>
    <form id="wifi-form" hidden>
      <label id="wifi-ssid-label" hidden>Network name <input id="wifi-ssid" autocomplete="off" maxlength="32"></label>
      <label id="wifi-psk-label">Password <input id="wifi-psk" type="password" autocomplete="off" maxlength="64"></label>
      <div class="actions">
        <button type="submit" id="wifi-join">Connect</button>
        <button type="button" id="wifi-cancel" class="secondary">Cancel</button>
      </div>
    </form>
    <p id="wifi-message" class="detail" role="status"></p>
  </section>
  <div id="dev" class="dev" hidden>DEVELOPMENT IMAGE</div>
</main>
<script src="status.js"></script>
</body>
</html>
