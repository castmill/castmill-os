# Castmill OS RAUC system configuration for the Raspberry Pi 5 (generated
# from meta-castmill). See docs/specs/03-updates.md, ADR-0002 and ADR-0009.

[system]
compatible=@COMPATIBLE@
# The firmware's tryboot A/B (autoboot.txt), through castmill-tryboot.
bootloader=custom
data-directory=/data/rauc
# Installing never changes the boot order: castmill-agent activates the new
# slot explicitly (mark-active) inside the maintenance window (UPD-003).
activate-installed=false
bundle-formats=-plain
max-bundle-download-size=2147483648

[handlers]
bootloader-custom-backend=/usr/lib/castmill/castmill-tryboot
# Writes the new slot's boot partition from its root filesystem.
post-install=/usr/lib/castmill/castmill-bootfs-install

[keyring]
path=/usr/lib/rauc/keyring.pem
use-bundle-signing-time=true

[streaming]
# Bundles are streamed over HTTPS (mTLS with the device identity).
send-headers=boot-id;machine-id;serial;variant;transaction-id;uptime

[slot.rootfs.0]
device=/dev/disk/by-partuuid/@UUID_A@
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-partuuid/@UUID_B@
type=ext4
bootname=B
