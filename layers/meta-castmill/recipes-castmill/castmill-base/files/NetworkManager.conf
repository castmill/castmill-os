# Castmill OS NetworkManager configuration (spec 05 "Network").
# Connection profiles live on /data (written by castmill-agent provision).
[main]
plugins=keyfile
dns=default
# Ethernet and Wi-Fi come up without configuration.
no-auto-default=

[keyfile]
path=/data/castmill/config/network

[device]
wifi.scan-rand-mac-address=no

[connection]
# Ethernet > Wi-Fi.
ethernet.route-metric=100
wifi.route-metric=600
ipv6.addr-gen-mode=stable-privacy
connection.autoconnect-retries=0

# TODO: connectivity check against the Castmill backend (captive portal detection).
#[connectivity]
#uri=https://castmill.net/api/os/v1/connectivity
#interval=300
