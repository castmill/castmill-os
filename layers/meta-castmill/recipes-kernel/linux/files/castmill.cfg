# Castmill OS kernel requirements (spec 05).
# Watchdogs (REL-003): Intel TCO, QEMU i6300esb, Raspberry Pi.
CONFIG_WATCHDOG=y
CONFIG_WATCHDOG_CORE=y
CONFIG_I6300ESB_WDT=m
# zram compressed swap in RAM (no swap on flash).
CONFIG_SWAP=y
CONFIG_ZRAM=m
CONFIG_ZSMALLOC=y
CONFIG_CRYPTO_ZSTD=y
CONFIG_CRYPTO_LZ4=y
# Firewall (nftables, inet family, conntrack).
CONFIG_NETFILTER=y
CONFIG_NF_CONNTRACK=y
CONFIG_NF_TABLES=y
CONFIG_NF_TABLES_INET=y
CONFIG_NFT_CT=y
# Chromium sandbox (user namespaces).
CONFIG_USER_NS=y
# Read-only rootfs integrity (dm-verity, phase 1) and the data partition.
CONFIG_MD=y
CONFIG_BLK_DEV_DM=y
CONFIG_DM_VERITY=y
CONFIG_EXT4_FS=y
CONFIG_VFAT_FS=y
