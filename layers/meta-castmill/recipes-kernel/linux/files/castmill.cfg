# Castmill OS kernel requirements (spec 05).
# Watchdogs (REL-003): Intel TCO, QEMU i6300esb, Raspberry Pi.
CONFIG_WATCHDOG=y
CONFIG_WATCHDOG_CORE=y
CONFIG_I6300ESB_WDT=m
# zram compressed swap in RAM (no swap on flash).
CONFIG_SWAP=y
CONFIG_ZRAM=m
CONFIG_ZSMALLOC=y
CONFIG_CRYPTO_ZSTD=y
CONFIG_CRYPTO_LZ4=y
# Firewall (nftables, inet family, conntrack).
CONFIG_NETFILTER=y
CONFIG_NF_CONNTRACK=y
CONFIG_NF_TABLES=y
CONFIG_NF_TABLES_INET=y
CONFIG_NFT_CT=y
# Chromium sandbox (user namespaces).
CONFIG_USER_NS=y
# Root disk drivers built in: the kernel mounts the slot without an
# initramfs (virtio for the dev VM, NVMe/SATA/eMMC/USB for real hardware).
CONFIG_VIRTIO=y
CONFIG_VIRTIO_PCI=y
CONFIG_VIRTIO_BLK=y
CONFIG_BLK_DEV_NVME=y
CONFIG_ATA=y
CONFIG_SATA_AHCI=y
CONFIG_MMC=y
CONFIG_MMC_BLOCK=y
CONFIG_SCSI=y
CONFIG_BLK_DEV_SD=y
CONFIG_PARTITION_ADVANCED=y
CONFIG_EFI_PARTITION=y
# Read-only rootfs integrity (dm-verity, phase 1) and the data partition.
CONFIG_MD=y
CONFIG_BLK_DEV_DM=y
CONFIG_DM_VERITY=y
CONFIG_EXT4_FS=y
CONFIG_VFAT_FS=y
# castmill.conf on large USB sticks.
CONFIG_EXFAT_FS=y
# Display power control for the device schedule (MED-006): DDC/CI over
# /dev/i2c-*, and HDMI-CEC.
CONFIG_I2C=y
CONFIG_I2C_CHARDEV=y
CONFIG_MEDIA_CEC_SUPPORT=y
