CONFIG_ITCO_WDT=m
# HDMI-CEC tunnelled over DisplayPort AUX (USB-C/DP to HDMI adapters with
# CEC); Intel GPUs have no CEC of their own.
CONFIG_DRM_DISPLAY_DP_AUX_CEC=y
# Installer stick (castmill-os-installer): it loads no modules, so its root
# on a USB stick, the keyboard, FAT names and the text screen are built in.
CONFIG_USB_SUPPORT=y
CONFIG_USB=y
CONFIG_USB_XHCI_HCD=y
CONFIG_USB_XHCI_PCI=y
CONFIG_USB_EHCI_HCD=y
CONFIG_USB_EHCI_PCI=y
CONFIG_USB_STORAGE=y
CONFIG_USB_UAS=y
CONFIG_HID=y
CONFIG_HID_GENERIC=y
CONFIG_USB_HID=y
CONFIG_NLS=y
CONFIG_NLS_CODEPAGE_437=y
CONFIG_NLS_ISO8859_1=y
CONFIG_DEVTMPFS=y
CONFIG_FB=y
CONFIG_FB_EFI=y
CONFIG_FRAMEBUFFER_CONSOLE=y
