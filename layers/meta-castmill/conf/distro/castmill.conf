# Castmill OS distribution configuration.
# See docs/specs/02-system-architecture.md

DISTRO = "castmill"
DISTRO_NAME = "Castmill OS"
# OS version: SemVer (spec 10). CI sets CASTMILL_VERSION with
# scripts/version.sh (release tag, or a -dev pre-release for other commits).
CASTMILL_VERSION ??= "0.1.0-dev"
DISTRO_VERSION = "${CASTMILL_VERSION}"
DISTRO_CODENAME = "phase0"
MAINTAINER = "Castmill OS maintainers"

TARGET_VENDOR = "-castmill"
SDK_VENDOR = "-castmillsdk"

# systemd only; no SysVinit.
INIT_MANAGER = "systemd"

# Only what a signage player needs. There is no X server (MED-001); "x11" is
# enabled only because the prebuilt Electron binary links against the X11
# client libraries (libX11, libxcb, ...) and GTK3, even when it runs as a
# native Wayland client. No "vulkan": nothing uses it (Weston and Electron
# render with GLES; Electron bundles its own Vulkan loader).
DISTRO_FEATURES = " \
    acpi alsa efi ipv4 ipv6 pci usbhost wifi \
    opengl wayland x11 \
    pam polkit seccomp systemd usrmerge \
    rauc \
"
DISTRO_FEATURES_OPTED_OUT += "pulseaudio sysvinit gobject-introspection-data vulkan"

# Hardening (security_flags), no static libraries, uninative and SPDX SBOMs
# (create-spdx) come from OE-core's defaultsetup.conf.
# TODO (SEC-009): CVE report per release. Wrynose replaced cve-check with
# sbom-cve-check (scans the SPDX SBOM); wire it into build.yml / cve-watch.yml.

# Licenses: no GPLv3 restrictions for now; revisit with the license decision.

# Package manager is not shipped on the device (whole-image updates only).
IMAGE_FEATURES:remove = "package-management"

# No runqemu support (scripts/run-vm.sh is used instead): qemuboot would
# build a full system QEMU with virglrenderer, SDL and a native Mesa.
IMAGE_CLASSES:remove = "qemuboot"

# No initramfs: the A/B bootloader boots the kernel from the slot directly,
# with the root-disk drivers built in (recipes-kernel/linux/files/castmill.cfg).
INITRAMFS_IMAGE = ""

# --- Disk layout (spec 02) -----------------------------------------------------
# Fixed GPT partition UUIDs. Used by the wks file, the RAUC slot configuration,
# the mount units and the bootloader configuration; change them together.
CASTMILL_UUID_BOOT = "35068262-4456-4fa0-ac57-f1caea9d3ff2"
CASTMILL_UUID_ROOTFS_A = "5860f039-cafe-449b-a9ae-42ce41dca24a"
CASTMILL_UUID_ROOTFS_B = "55dfc0af-8868-4fe5-a746-7d4a23e3477f"
CASTMILL_UUID_DATA = "14dec8df-74ce-430c-91ee-6fcb62495345"
# Root filesystem of the x86-64 installer stick (castmill-installer.wks.in).
CASTMILL_UUID_INSTALLER = "8c1f6c55-2b7e-4f0a-9d63-3a9e7f1c2d40"
CASTMILL_SLOT_SIZE ?= "1536M"

# RAUC "compatible": a bundle installs only on the hardware family it was built for.
CASTMILL_COMPATIBLE = "castmill-os-${MACHINE}"

# Extra kernel command line (bootloader configuration).
CASTMILL_KERNEL_CMDLINE ?= "quiet panic=10 console=tty0"

# --- Backend (spec 07) -------------------------------------------------------------
# Production Castmill backend. The kiosk shell loads Castmill's device app
# from <url>/ (docs/castmill-integration.md). Override for staging or
# white-label builds.
CASTMILL_BACKEND_URL ?= "https://castmill.net"
# Path (on the build host) to the pinned backend CA bundle. Empty = the
# system's public CA roots (ca-certificates).
# TODO: pin the backend CA before v1.0 (spec 04, "Impersonating ... the server").
CASTMILL_BACKEND_CA ?= ""

# --- Keys (spec 03 "Signing and keys") ----------------------------------------------
# Directory with rauc-signing.{cert,key}.pem and rauc-keyring.pem. Never in the
# repository; CI provides development keys, production signing happens in the
# protected release environment. scripts/gen-dev-keys.sh creates local dev keys.
CASTMILL_KEYS_DIR ??= "${TOPDIR}/castmill-dev-keys"

# --- Branding --------------------------------------------------------------------
# ASCII logo shown by GRUB and on the console during boot: printable ASCII,
# at most 76 columns, no single quotes. White-label builds point this at
# their own file.
CASTMILL_LOGO ?= "${LAYERDIR_castmill}/files/branding/logo.txt"

# Development image overlay (kas/dev.yml sets CASTMILL_DEV_IMAGE = "1").
CASTMILL_DEV_IMAGE ??= "0"

# Storage (REL-006): /var/log is volatile; a small persistent journal ring
# buffer lives on /data (castmill-base).
