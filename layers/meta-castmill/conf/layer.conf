BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

# Appends for optional BSP layers, active only when that layer is present.
BBFILES_DYNAMIC += " \
    raspberrypi:${LAYERDIR}/dynamic-layers/raspberrypi/*/*/*.bbappend \
"
LAYERDIR_castmill := "${LAYERDIR}"

BBFILE_COLLECTIONS += "castmill"
BBFILE_PATTERN_castmill = "^${LAYERDIR}/"
BBFILE_PRIORITY_castmill = "10"

LAYERDEPENDS_castmill = "core openembedded-layer networking-layer rauc"
LAYERSERIES_COMPAT_castmill = "wrynose"

# Root of the castmill-os repository (agent/ and player/ sources).
CASTMILL_REPO_DIR := "${@os.path.normpath(os.path.join(d.getVar('LAYERDIR'), '..', '..'))}"
