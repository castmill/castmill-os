version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
# Go modules are not updated by Dependabot: the castmill-agent Yocto recipe
# pins every module by checksum. Bump with `go get` in agent/ and then run
# scripts/check-go-mods.sh --update (security alerts still come from
# Dependabot alerts).
