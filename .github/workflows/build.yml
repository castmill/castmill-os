# Yocto builds on larger runners (spec 10, ADR-0006). Trusted code only:
# pushes to main/release branches, PRs from branches of this repository,
# manual runs by maintainers (for reviewed fork PRs) and release.yml.
#
# Runners: standard GitHub-hosted runners (x86-64 and arm64, free for public
# repositories) by default. A cold build is close to their 6-hour limit, so
# the bitbake step has its own timeout and the shared-state cache is saved
# even when it runs out: the next run continues from there. Set the
# repository variable CASTMILL_LARGER_RUNNERS=true to use the larger-runner
# group "castmill-os-builders" (label "castmill-os-builder") instead.
name: build

on:
  push:
    branches: [main, "release/**"]
    # Documentation changes don't change the image.
    paths-ignore: ["docs/**", "**/*.md", "LICENSES/**", ".github/workflows/docs.yml"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md", "LICENSES/**", ".github/workflows/docs.yml"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit to build (for example a reviewed fork PR head SHA)"
        required: false
        type: string
  workflow_call:
    secrets:
      CASTMILL_DEV_RAUC_KEY:
        required: false
      CASTMILL_DEV_RAUC_CERT:
        required: false
      CASTMILL_DEV_RAUC_KEYRING:
        required: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  KAS_VERSION: "5.5"

jobs:
  build:
    # Fork PRs never reach the build cache.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: ${{ matrix.name }}
    runs-on: >-
      ${{ vars.CASTMILL_LARGER_RUNNERS == 'true'
      && fromJSON('{"group":"castmill-os-builders","labels":"castmill-os-builder"}')
      || matrix.runner }}
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: vm-arm64
            config: kas/vm-arm64.yml:kas/dev.yml
            machine: genericarm64
            runner: ubuntu-24.04-arm
          - name: x86-64
            config: kas/x86-64.yml
            machine: genericx86-64
            runner: ubuntu-latest
          - name: rpi5
            config: kas/rpi5.yml
            machine: raspberrypi5
            runner: ubuntu-24.04-arm
    env:
      WORK: /mnt/yocto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Version
        id: version
        run: |
          # SemVer: vX.Y.Z tags give release versions; other commits a -dev pre-release.
          v="$(scripts/version.sh)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Castmill OS version: $v" >> "$GITHUB_STEP_SUMMARY"

      - name: Disk space
        env:
          LARGER_RUNNERS: ${{ vars.CASTMILL_LARGER_RUNNERS }}
        run: |
          # Standard runners: drop preinstalled SDKs we don't use and build on /mnt.
          if [ "$LARGER_RUNNERS" != "true" ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
              /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift || true
            sudo docker image prune -af >/dev/null || true
          fi
          sudo mkdir -p "$WORK"
          sudo chown "$(id -u):$(id -g)" "$WORK"
          mkdir -p "$WORK/sstate" "$WORK/downloads" "$WORK/kas"
          df -h / /mnt

      - name: Restore build cache (sstate, downloads)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            /mnt/yocto/sstate
            /mnt/yocto/downloads
          key: >-
            yocto-${{ matrix.name }}-${{ hashFiles('kas/*.yml', 'layers/**',
            'agent/**', 'player/**') }}
          restore-keys: |
            yocto-${{ matrix.name }}-

      - name: Development signing keys
        env:
          DEV_RAUC_KEY: ${{ secrets.CASTMILL_DEV_RAUC_KEY }}
          DEV_RAUC_CERT: ${{ secrets.CASTMILL_DEV_RAUC_CERT }}
          DEV_RAUC_KEYRING: ${{ secrets.CASTMILL_DEV_RAUC_KEYRING }}
        run: |
          keys="$RUNNER_TEMP/keys"
          if [ -n "$DEV_RAUC_KEY" ]; then
            mkdir -m 700 "$keys"
            printf '%s\n' "$DEV_RAUC_KEY" > "$keys/rauc-signing.key.pem"
            printf '%s\n' "$DEV_RAUC_CERT" > "$keys/rauc-signing.cert.pem"
            printf '%s\n' "$DEV_RAUC_KEYRING" > "$keys/rauc-keyring.pem"
          else
            echo "::warning::No development signing keys configured; using throw-away keys" \
              "(bundles from this run only install on images from this run)."
            scripts/gen-dev-keys.sh "$keys"
          fi

      - name: Build
        id: build
        # Leaves time to save the cache when a cold build runs out of time.
        timeout-minutes: 320
        env:
          CONFIG: ${{ matrix.config }}
          CASTMILL_VERSION: ${{ steps.version.outputs.version }}
          DL_DIR: /mnt/yocto/downloads
          SSTATE_DIR: /mnt/yocto/sstate
          KAS_WORK_DIR: /mnt/yocto/kas
        run: |
          pipx install "kas==${KAS_VERSION}"
          runtime_args="-v $RUNNER_TEMP/keys:/keys:ro -e CASTMILL_KEYS_DIR=/keys"
          runtime_args="$runtime_args -e CASTMILL_VERSION=$CASTMILL_VERSION"
          # -k: report every failing recipe in one run, not just the first.
          kas-container --runtime-args "$runtime_args" build "$CONFIG" -- -k

      - name: Disk usage
        if: always()
        run: df -h / /mnt

      - name: Save build cache (trusted pushes only)
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            /mnt/yocto/sstate
            /mnt/yocto/downloads
          key: >-
            yocto-${{ matrix.name }}-${{ hashFiles('kas/*.yml', 'layers/**',
            'agent/**', 'player/**') }}-${{ github.run_id }}

      - name: Collect artifacts
        env:
          MACHINE: ${{ matrix.machine }}
        run: |
          deploy="$WORK/kas/build/tmp/deploy/images/$MACHINE"
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          image="$deploy/castmill-os-image-$MACHINE.rootfs"
          cp -L "$image.wic.zst" "$image.wic.bmap" "$out"/
          cp -L "$image.spdx.json" "$out"/ 2>/dev/null || true
          cp -L "$deploy"/castmill-os-bundle-"$MACHINE".raucb "$out"/ 2>/dev/null || true
          ls -lh "$out"
          # GitHub Release assets must be < 2 GiB (spec 10).
          find "$out" -type f -size +2047M -print -exec false {} + || { echo "artifact too large"; exit 1; }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: image-${{ matrix.name }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 14
