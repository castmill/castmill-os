# Release: tag vX.Y.Z (or vX.Y.Z-rc.N) -> build every target -> GitHub
# pre-release with images, RAUC bundles, SBOMs, CVE reports and SHA256SUMS.
#
# Images trust only the production root CA. Bundles are built signed with the
# development key and re-signed with the production key by the "sign" job,
# which runs in the protected "production-signing" environment (a maintainer
# approves it; docs/release-signing.md). QEMU/lab test gates and provenance
# attestations come later.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      actions: write  # build.yml replaces each target's build cache
    uses: ./.github/workflows/build.yml  # zizmor: ignore[self-repository] actionlint lacks $/ support
    with:
      production-keyring: true
    secrets:
      CASTMILL_DEV_RAUC_KEY: ${{ secrets.CASTMILL_DEV_RAUC_KEY }}
      CASTMILL_DEV_RAUC_CERT: ${{ secrets.CASTMILL_DEV_RAUC_CERT }}
      CASTMILL_DEV_RAUC_KEYRING: ${{ secrets.CASTMILL_DEV_RAUC_KEYRING }}

  # The only job that can read the production signing key: it waits for a
  # maintainer's approval (environment protection rule).
  sign:
    needs: build
    runs-on: ubuntu-latest
    environment: production-signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: layers/meta-castmill/files/keys

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: image-*
          path: dist
          merge-multiple: true

      - name: Install RAUC
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends rauc

      - name: Re-sign bundles with the production key
        env:
          PROD_KEY: ${{ secrets.CASTMILL_PROD_RAUC_KEY }}
          PROD_CERT: ${{ secrets.CASTMILL_PROD_RAUC_CERT }}
          DEV_KEYRING: ${{ secrets.CASTMILL_DEV_RAUC_KEYRING }}
        run: |
          set -euo pipefail
          if [ -z "$PROD_KEY" ] || [ -z "$PROD_CERT" ] || [ -z "$DEV_KEYRING" ]; then
            echo "::error::Missing CASTMILL_PROD_RAUC_KEY/CERT (production-signing environment)" \
              "or CASTMILL_DEV_RAUC_KEYRING (docs/release-signing.md)."
            exit 1
          fi
          k="$RUNNER_TEMP/keys"
          mkdir -m 700 "$k"
          trap 'rm -rf "$k"' EXIT
          printf '%s\n' "$PROD_KEY" > "$k/key.pem"
          printf '%s\n' "$PROD_CERT" > "$k/cert.pem"
          printf '%s\n' "$DEV_KEYRING" > "$k/dev-keyring.pem"
          ring=layers/meta-castmill/files/keys/production-keyring.pem
          # Check the certificates as code signers, as devices do (system.conf
          # check-purpose); RAUC's default is S/MIME, which rejects them.
          conf="$RUNNER_TEMP/rauc.conf"
          printf '[system]\ncompatible=castmill-os\nbootloader=noop\n[keyring]\ncheck-purpose=codesign\n' > "$conf"
          for b in dist/*.raucb; do
            # --keyring checks the development signature, --signing-keyring
            # the new one.
            rauc --conf "$conf" resign --cert "$k/cert.pem" --key "$k/key.pem" \
              --keyring "$k/dev-keyring.pem" --signing-keyring "$ring" "$b" "$b.signed"
            # The production images must accept it.
            rauc --conf "$conf" info --keyring "$ring" "$b.signed" > /dev/null
            mv "$b.signed" "$b"
            echo "re-signed $(basename "$b")"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: signed-bundles
          path: dist/*.raucb
          if-no-files-found: error

  # CVE report per image (SEC-009): OE-core's sbom-cve-check on each SBOM,
  # against the CVE databases of the release day. Runs while "sign" waits
  # for approval; open CVEs are reported, they don't block the release.
  cve-report:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: image-*
          path: dist
          merge-multiple: true

      - name: Scan the SBOMs
        env:
          # The CVE databases are ~9 GB: keep them on the larger /mnt disk.
          SBOM_CVE_CHECK_DATABASES_DIR: /mnt/cve-db
        run: |
          sudo mkdir -p "$SBOM_CVE_CHECK_DATABASES_DIR"
          sudo chown "$(id -u):$(id -g)" "$SBOM_CVE_CHECK_DATABASES_DIR"
          mkdir cve
          mv dist/*.spdx.json cve/
          scripts/cve-report.sh cve
          rm cve/*.spdx.json
          {
            echo "| Image | Open CVEs | Packages affected |"
            echo "|---|---|---|"
            for f in cve/*.cve.txt; do
              echo "| $(basename "$f" .cve.txt) | $(grep -o 'CVE-[0-9-]*' "$f" | wc -l) | $(wc -l < "$f") |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: cve-report
          path: cve/
          if-no-files-found: error

  publish:
    needs: [build, sign, cve-report]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: image-*
          path: dist
          merge-multiple: true

      # Replace the development-signed bundles with the production-signed ones.
      - name: Drop development-signed bundles
        run: rm -f dist/*.raucb

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: signed-bundles
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: cve-report
          path: dist

      # Release manifest for Castmill's OS updates (ADR-0010).
      - name: Manifest
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: python3 scripts/release-manifest.py dist "$TAG" "$REPO"

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          cat > "$notes" <<'MD'
          > **Pre-release for testing.** Update bundles are signed with the Castmill OS
          > production key and these images only accept production-signed updates.
          > The vm-arm64 image is a development image (SSH, root login).

          Intel/x86-64 PCs: write `castmill-os-installer-genericx86-64.img.xz` to a USB
          stick (Raspberry Pi Imager, balenaEtcher, Rufus) and boot the PC from it.
          Raspberry Pi 5: flash `castmill-os-image-raspberrypi5.rootfs.wic.zst` to the
          SD card or SSD. Install guides: https://os.castmill.com/install/
          Updates: serve the `.raucb` bundle to devices built from the same release keys.
          Security: each image has an SBOM (`.spdx.json`) and a CVE report from the
          release day (`.cve.txt`, and `.cve.json` in Yocto's cve-check format).
          MD
          gh release create "$TAG" dist/* --prerelease --title "Castmill OS ${TAG#v}" \
            --notes-file "$notes" --generate-notes
