# Castmill OS for Raspberry Pi 5 / Compute Module 5.

header:
  version: 14
  includes:
    - kas/base.yml

machine: raspberrypi5

# A/B updates with the firmware's tryboot (ADR-0009).
target:
  - castmill-os-image
  - castmill-os-bundle

repos:
  meta-raspberrypi:
    url: https://github.com/agherzan/meta-raspberrypi.git
    branch: wrynose

local_conf_header:
  castmill-rpi5: |
    # Required by the Raspberry Pi Wi-Fi/Bluetooth firmware packages.
    LICENSE_FLAGS_ACCEPTED += "synaptics-killswitch"
    # Two HDMI outputs, full KMS driver.
    VC4DTBO = "vc4-kms-v3d"
    # A/B layout with tryboot (files/wic/castmill-rpi.wks.in, ADR-0009).
    # cmdline.txt is for slot A; castmill-bootfs-install rewrites root= and
    # rauc.slot= when it writes slot B's boot partition.
    CMDLINE_ROOTFS = "root=PARTUUID=${CASTMILL_UUID_ROOTFS_A} rootfstype=ext4 ro rootwait"
    CMDLINE_ROOTFS += "systemd.gpt_auto=0 rauc.slot=A"
    # Partition 1 ("boot") only holds autoboot.txt; boot_a gets the boot files.
    IMAGE_BOOT_FILES_label-boot = "castmill-autoboot.txt;autoboot.txt"
    WICVARS:append = " IMAGE_BOOT_FILES_label-boot"
    CASTMILL_FIRMWARE = "linux-firmware-rpidistro-bcm43455 bluez-firmware-rpidistro-bcm4345c0-hcd"
    # TODO: signed boot (Phase 2).
