<!doctype html>
<!--
  Social cover of the documentation site (docs/public/og.png, 1200x630).
  Regenerate after changing it: docs/.vitepress/social/render.sh
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Castmill OS social cover</title>
<style>
  @font-face {
    font-family: Inter;
    font-weight: 100 900;
    src: url(../../node_modules/vitepress/dist/client/theme-default/fonts/inter-roman-latin.woff2) format("woff2");
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    font-family: Inter, system-ui, sans-serif;
    color: #e6edf3;
    background:
      radial-gradient(640px 420px at 84% 46%, rgba(253, 79, 0, 0.34), transparent 70%),
      radial-gradient(520px 360px at 6% 108%, rgba(245, 158, 11, 0.16), transparent 70%),
      #0b0f14;
  }
  /* Faint scanlines: a nod to the console. */
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.022) 0 1px, transparent 1px 4px);
  }
  .left {
    position: absolute;
    left: 72px;
    top: 72px;
    width: 500px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 22px;
    font-weight: 600;
    color: #8b949e;
    letter-spacing: 0.01em;
  }
  .brand img { width: 40px; height: 40px; }
  h1 {
    margin-top: 44px;
    font-size: 92px;
    line-height: 1;
    font-weight: 800;
    letter-spacing: -0.035em;
    background: linear-gradient(120deg, #fd4f00 15%, #f59e0b 90%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .tagline {
    margin-top: 22px;
    font-size: 38px;
    line-height: 1.18;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #f0f3f6;
  }
  .pills {
    position: absolute;
    left: 72px;
    bottom: 72px;
    display: flex;
    gap: 10px;
  }
  .pills span {
    padding: 9px 16px;
    border-radius: 999px;
    border: 1px solid #30363d;
    background: rgba(22, 27, 34, 0.8);
    font-size: 19px;
    font-weight: 500;
    color: #c9d1d9;
  }
  .url {
    position: absolute;
    right: 72px;
    bottom: 80px;
    font: 500 19px ui-monospace, "SF Mono", Menlo, monospace;
    color: #8b949e;
  }
  .term {
    position: absolute;
    right: 64px;
    top: 150px;
    width: 520px;
    border-radius: 16px;
    background: #0d1117;
    border: 1px solid #30363d;
    box-shadow: 0 30px 80px -24px rgba(253, 79, 0, 0.55), 0 2px 10px rgba(0, 0, 0, 0.5);
    overflow: hidden;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  .bar {
    display: flex;
    gap: 7px;
    align-items: center;
    padding: 12px 16px;
    background: #161b22;
    border-bottom: 1px solid #30363d;
  }
  .bar i { width: 11px; height: 11px; border-radius: 50%; background: #30363d; }
  .bar em { margin-left: auto; font-style: normal; font-size: 12px; color: #8b949e; }
  pre {
    padding: 28px 20px 8px;
    font: 600 11.6px/1.22 ui-monospace, "SF Mono", Menlo, monospace;
    color: #ff8a4c;
    white-space: pre;
  }
  .info { padding: 10px 20px 6px; font-size: 14.5px; color: #c9d1d9; }
  .info b { color: #ff8a4c; font-weight: 400; }
  .ok { padding: 2px 20px 26px; font-size: 14.5px; color: #8b949e; }
  .ok span { color: #3fb950; }
  .tm { font-size: 0.32em; vertical-align: super; line-height: 0; margin-left: 0.05em; }
</style>
</head>
<body>
  <div class="left">
    <div class="brand"><img src="../../public/logo.svg" alt="">Castmill™</div>
    <h1>Castmill<sup class="tm">™</sup> OS</h1>
    <p class="tagline">Immutable, self-healing<br>Linux for digital signage</p>
  </div>

  <div class="term">
    <div class="bar"><i></i><i></i><i></i><em>tty1</em></div>
    <pre id="logo"></pre>
    <p class="info">Castmill OS 0.2.0 - raspberrypi5 - slot A<b>▍</b></p>
    <p class="ok">[<span>  OK  </span>] Started castmill-player@HDMI-A-1.service</p>
  </div>

  <div class="pills"><span>A/B updates</span><span>Auto rollback</span><span>Open source</span></div>
  <div class="url">os.castmill.com</div>

  <script>
    // Same logo the device prints at boot (single source in the Yocto layer).
    fetch('../../../layers/meta-castmill/files/branding/logo.txt')
      .then((r) => r.text())
      .then((t) => { document.getElementById('logo').textContent = t.replace(/\n+$/, ''); });
  </script>
</body>
</html>
